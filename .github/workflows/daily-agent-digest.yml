name: Daily Agent Digest

on:
  schedule:
    # 每天 00:30 UTC = 北京时间 08:30
    - cron: '30 0 * * *'
  workflow_dispatch: # 允许手动触发，便于首次部署验证

# contents: write 用于把 data/ 数据与代码变更自动提交回仓库
permissions:
  contents: write

jobs:
  daily-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily digest
        env:
          # 手动配置的 Secrets
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          # GITHUB_TOKEN 由 GitHub Actions 自动注入，无需手动配置
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python agents/daily-digest/main.py

      # 把本次产生的全部变更（data/、代码、文档）自动提交回仓库，
      # 作为下次去重的历史依据，并保证仓库始终与最新运行结果同步
      - name: Commit changes
        run: |
          git config user.name "agentforge-bot"
          git config user.email "agentforge-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update daily digest data and files"
            git push
          fi
